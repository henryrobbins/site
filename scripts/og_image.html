<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }

  .plate {
    width: 1200px;
    height: 630px;
    background: #0b0b0b;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: 'IBM Plex Mono', monospace;
  }

  .plate img {
    width: 100%;
    height: 0;
    flex: 1 1 0;
    min-height: 0;
    object-fit: cover;
  }

  .caption {
    background: #ffffff;
    border-top: 1px solid #111111;
    padding: 26px 40px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .name {
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .meta { font-size: 19px; color: #6b6b68; }
  .meta .site { color: #111111; }
</style>
</head>
<body>
  <div class="plate">
    <img src="../src/assets/artwork/memory/lost_cat_memory_110.jpeg" alt="">
    <div class="caption">
      <span class="name">Henry Robbins</span>
      <span class="meta">PhD student, Stanford &nbsp;·&nbsp; <span class="site">henryrobbins.com</span></span>
    </div>
  </div>
</body>
</html>
